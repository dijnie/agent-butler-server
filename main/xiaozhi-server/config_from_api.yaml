# If you only want a lightweight xiaozhi-server installation that uses the local configuration file, ignore this file; you do not need to change anything in it
# If you want to get the configuration from manager-api, read on:
# Copy this file into the xiaozhi-server/data directory (create the data directory if it does not exist) and name the copied file .config.yaml
# Note: if the data directory already has a .config.yaml file, delete it first
# Start manager-api and manager-web first and register an account; the first registered account is the administrator
# As the administrator, open the [Parameter Management] page, find [server.secret] and copy its parameter value; note that server.secret changes every time you deploy from scratch
# Open the .config.yaml file in the data directory and set manager-api.secret to the server.secret you just copied
server:
  ip: 0.0.0.0
  port: 8000
  # Port of the http service, used for the vision analysis interface
  http_port: 8003
  # Vision analysis interface address
  # The vision analysis interface address sent to the device
  # With the default value below, the system generates the vision recognition address automatically and prints it in the startup log; you can confirm it by opening it in a browser
  # When you deploy with docker or on the public network (with ssl or a domain name), it may not be accurate
  # So if you deploy with docker, set vision_explain to the LAN address
  # If you deploy on the public network, set vision_explain to the public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
manager-api:
  # Address of your manager-api; a LAN ip is preferred
  # If you deploy with docker, set it to http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Token of your manager-api, i.e. the server.secret you just copied
  secret: 你的server.secret值
# Default system prompt template file
prompt_template: agent-base-prompt.txt