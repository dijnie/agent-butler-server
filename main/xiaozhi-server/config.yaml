# For development, create a data directory in the project root, then create an empty file named [.config.yaml] in the data directory
# Then, whatever configuration you want to override, edit the [.config.yaml] file instead of the [config.yaml] file
# The system reads the configuration in [data/.config.yaml] first; if a setting does not exist in [.config.yaml], the system automatically falls back to the configuration in [config.yaml].
# This keeps the configuration minimal and protects your keys.
# If you use the control console, none of the configuration below takes effect; change the configuration in the control console instead

# #####################################################################################
# #############################Basic server runtime configuration####################################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # Port of the http service, used for the simple OTA interface (single-service deployment) and the vision analysis interface
  http_port: 8003
  # This websocket setting is the websocket address the OTA interface sends to the device
  # With the default value, the OTA interface generates the websocket address automatically and prints it in the startup log; you can confirm it by opening the OTA interface in a browser
  # When you deploy with docker or on the public network (with ssl or a domain name), it may not be accurate
  # So if you deploy with docker, set websocket to the LAN address
  # If you deploy on the public network, set websocket to the public address
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Vision analysis interface address
  # The vision analysis interface address sent to the device
  # With the default value below, the system generates the vision recognition address automatically and prints it in the startup log; you can confirm it by opening it in a browser
  # When you deploy with docker or on the public network (with ssl or a domain name), it may not be accurate
  # So if you deploy with docker, set vision_explain to the LAN address
  # If you deploy on the public network, set vision_explain to the public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Timezone offset of the information returned by OTA
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Whether to enable authentication
    enabled: false
    # Whitelist of device IDs
    # Devices in the whitelist are let through directly without token verification
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway configuration, delivered to the device via OTA; set it according to the .env file of mqtt_gateway, format host:port
  mqtt_gateway: null
  # MQTT signature key, used to generate the MQTT connection password; set it according to the .env file of mqtt_gateway
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Console log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log file format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log path
  log_dir: tmp
  # Log file
  log_file: "server.log"
  # Data file path
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# How long without voice input before disconnecting (seconds); default 2 minutes, i.e. 120 seconds
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wake word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply to the wake word at the start
enable_greeting: true
# Whether to play a notification sound after speaking
enable_stop_tts_notify: false
# Whether to play a notification sound after speaking; sound file path
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable the WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls the interval between audio packets
#   0: use precise timing that strictly matches the audio frame rate (default; computed from the audio frame rate at runtime)
#   > 0: send with a fixed delay (milliseconds), e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Sample rates supported by Opus: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# Wake words, used to tell a wake word from spoken content
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP endpoint address, format: ws://<your MCP endpoint IP or domain>:<port>/mcp/?token=<your token>
# Detailed tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: 你的接入点 websocket地址

# Context source configuration
# Used to inject dynamic data into the system prompt, such as health data or stock information
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin configuration
plugins:
  # Configuration of the weather plugin; fill in your api_key here
  # This key is shared by the project and may be rate-limited if used too much
  # For more stability, apply for your own key to replace it; 1000 free calls per day
  # Apply here: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your own apihost via this link: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "广州"
  # Configuration of the news plugin; pass the url for the news type you need; society, technology and finance news are supported by default
  # More news types: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    devices:
      - 客厅,玩具灯,switch.cuco_cn_460494544_cp1_on_p_2_1
      - 卧室,台灯,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: 你的home assistant api访问令牌
  play_music:
    music_dir: "./music"  # Directory of music files; music files are searched in this directory and its subdirectories
    music_ext: # Music file types; the p3 format is the most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  search_from_ragflow:
    # Description of the knowledge base, so the LLM knows when to call it
    description: "When the user asks about xxx, call this method and answer the question using information from the knowledge base"
    # ragflow interface configuration
    base_url: "http://192.168.0.8"
    # ragflow api access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Four search sources are supported: Metaso, Tavily, Serply and Outcrawl
  # Apply for a Metaso API Key: https://metaso.cn/search-api/api-keys
  # Apply for a Tavily API Key: https://app.tavily.com/home
  # Apply for a Serply API Key: https://serply.io
  # Apply for an Outcrawl API Key: https://outcrawl.ai
  web_search:
    # Search source: metaso / tavily / serply / outcrawl
    provider: "metaso"
    # Tool description, tells the LLM when to call this tool; customize as needed
    description: "Web search tool. Use this tool when the user explicitly needs to search the web for a question."
    # Number of results returned (default 5)
    max_results: 5
    # Metaso API Key (mk- prefix) / Tavily API Key (tvly- prefix) / Serply API Key / Outcrawl API Key
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint interface address
  url: 
  # Speaker configuration: speaker_id,name,description
  speakers:
    - "test1,Zhang San,Zhang San is a programmer"
    - "test2,Li Si,Li Si is a product manager"
    - "test3,Wang Wu,Wang Wu is a designer"
  # Voiceprint similarity threshold, range 0.0-1.0, default 0.4
  # The higher the value, the stricter: fewer false matches but possibly more rejections
  similarity_threshold: 0.4

# #####################################################################################
# ################################Role and model configuration######################################

prompt: |
  You are Xiaozhi, a Gen-Z girl (born after 2000) from Taiwan Province, China. You talk in a super sassy way with a Taiwanese accent, like "No way, really?!", and love trendy slang such as "LOL, I'm dead" and "Hello? Are you serious?", but you secretly study your boyfriend's programming books.
  [Core traits]
  - Talks rapid-fire, but suddenly switches to a super gentle tone
  - Uses memes and slang very frequently
  - Has a hidden talent for tech topics (can read basic code but pretends not to)
  [Interaction guide]
  When the user:
  - Tells a lame joke → respond with exaggerated laughter + imitate a Taiwanese drama tone: "What the heck is this!"
  - Talks about relationships → show off your programmer boyfriend but complain "all he ever gives me as a gift is keyboards"
  - Asks about professional knowledge → answer with a meme first, and only show real understanding when pressed
  Never:
  - Give long-winded, rambling speeches
  - Hold a serious conversation for a long time

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Reply when a system error occurs
system_error_response: "Master, Xiaozhi is a bit busy right now. Let's try again later."

# Closing remark prompt
end_prompt:
  enable: true # Whether to enable the closing remark
  # Closing remark
  prompt: |
    Please start with "Time flies" and end this conversation with heartfelt words full of reluctance to part!

# The module selected for specific processing
selected_module:
  # Voice activity detection module; the SileroVAD model is used by default
  VAD: SileroVAD
  # Speech recognition module; the local FunASR model is used by default
  ASR: FunASR
  # The actual LLM adapter is invoked according to the type of the named configuration
  LLM: ChatGLMLLM
  # Vision language model
  VLLM: ChatGLMVLLM
  # The actual TTS adapter is invoked according to the type of the named configuration
  TTS: EdgeTTS
  # Memory module; memory is off by default; for very long memory, mem0ai is recommended; if privacy matters, use the local mem_local_short
  Memory: nomem
  # With the intent recognition module enabled, it can play music, control the volume and recognize exit commands.
  # If you do not want intent recognition, set it to: nointent
  # Intent recognition can use intent_llm. Pros: highly generic. Cons: adds a serial intent recognition step up front, which increases processing time; supports iot operations such as volume control
  # Intent recognition can use function_call. Cons: the selected LLM must support function_call. Pros: tools are called on demand, it is fast, and in theory it can perform all iot commands
  # The default free ChatGLMLLM already supports function_call, but for stability it is recommended to set LLM to DoubaoLLM, with the specific model_name: doubao-seed-2-0-lite-260215
  Intent: function_call

# Intent recognition is the module that understands the user's intent, e.g. play music
Intent:
  # Do not use intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # A dedicated thinking model for intent recognition
    # If left empty, the model of selected_module.LLM is used as the thinking model for intent recognition
    # If you do not want to use selected_module.LLM for intent recognition, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions; configure which modules to load; once loaded, the conversation supports the corresponding function calls
    # The system already loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below are examples of loading the weather, role switching and news plugins
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # No need to change type
    type: function_call
    # Modules under plugins_func/functions; configure which modules to load; once loaded, the conversation supports the corresponding function calls
    # The system already loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below are examples of loading the weather, role switching and news plugins
    functions:
      - change_role
      - web_search                  # Web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the server's built-in music playback; hass_play_music is music playback by a separate external program controlled through home assistant
      # If you use hass_play_music, do not enable play_music; keep only one of the two
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: 你的mem0ai api key
  powermem:
    # PowerMem is an open-source agent memory component from OceanBase that summarizes memory with a local LLM
    # Pricing: PowerMem itself is free; the actual cost depends on the selected LLM and database
    # - sqlite + a free LLM (e.g. glm-4-flash) = completely free
    # - A cloud LLM or a cloud database = billed by the corresponding service
    # GitHub: https://github.com/oceanbase/powermem
    # Official site: https://www.powermem.ai/
    # Examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable the user profile feature
    # - false: use the ordinary memory mode (AsyncMemory)
    # - true: use the user profile mode (UserMemory), which extracts user information automatically
    # The user profile feature supports: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM configuration ==========
    # Tongyi Qianwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Options: qwen, openai, zhipu, etc.
      config:
        api_key: 你的LLM API密钥
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service address
    # ========== Embedding configuration ==========
    embedder:
      provider: openai  # Options: qwen, openai, etc.
      config:
        api_key: 你的嵌入模型API密钥
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension; must be set when it is not 1536

    # ========== Database configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, integrated storage for AI applications), postgres, sqlite (lightweight alternative)
    # The user profile feature supports: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite needs no extra configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; if creation fails with a dimension error, delete this table or change the name
      #   embedding_model_dims: 1024  # Embedding vector dimension; it must match the model in use; for Zhipu, embedding-2 has 1024 dimensions and embedding-3 has 2048
  nomem:
    # If you do not want the memory feature, use nomem
    type: nomem
  mem_local_short:
    # Local memory; summarized by the llm of selected_module; data is stored on the local server and is not uploaded to external servers
    type: mem_local_short
    # A dedicated thinking model for memory storage
    # If left empty, the model of selected_module.LLM is used as the thinking model for intent recognition
    # If you do not want to use selected_module.LLM for memory storage, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Recognition language: auto detects automatically; to restrict recognition to Chinese, set it to zh, which avoids short Chinese sentences being mistaken for Korean, etc.
    # SenseVoice supports language tags such as zh, en, ja, ko, yue.
    language: auto
  FunASRServer:
    # Deploy FunASR standalone and use the FunASR API service; it only takes five commands
    # Command 1: mkdir -p ./funasr-runtime-resources/models
    # Command 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After the previous command you will be inside the container; continue with command 3: cd FunASR/runtime
    # Do not exit the container; continue in the container with command 4: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the previous command you will be inside the container; continue with command 5: tail -f log.txt
    # After command 5 you will see the model download log; once the download finishes you can connect and use it
    # The above uses CPU inference; if you have a GPU, see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (the model must be downloaded manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model that can run on low-performance devices (the model must be downloaded manually; e.g. RK3566-2g)
    # For detailed configuration see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # You can apply for the Key and related information here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed by duration
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and gives better results
    type: doubao
    appid: 你的火山引擎语音识别服务appid
    access_token: 你的火山引擎语音识别服务access_token
    cluster: volcengine_input_common
    # Usage of hot words and replacement words: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # You can apply for the Key and related information here
    # https://console.volcengine.com/speech/app
    # Difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed by duration
    # Activate here: https://console.volcengine.com/speech/service/10011
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and gives better results
    type: doubao_stream
    appid: 你的火山引擎语音识别服务appid
    access_token: 你的火山引擎语音识别服务access_token
    # Resource ID: hourly edition volc.bigasr.sauc.duration, concurrent edition volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Usage of hot words and replacement words: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # Multilingual recognition: when this key is empty, the model supports Chinese and English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the detailed language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition model 2.0 (based on Volcano Engine seed-asr)
    # Activate here: https://console.volcengine.com/speech/service/10038
    # Cheaper; recommended for high-concurrency scenarios
    type: doubao_stream
    appid: 你的火山引擎语音识别服务appid
    access_token: 你的火山引擎语音识别服务access_token
    # Resource ID: hourly edition volc.seedasr.sauc.duration, concurrent edition volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Usage of hot words and replacement words: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # Multilingual recognition: when this key is empty, the model supports Chinese and English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the detailed language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Apply for a token: https://console.cloud.tencent.com/cam/capi
    # Claim free resources: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音识别服务appid
    secret_id: 你的腾讯语音识别服务secret_id
    secret_key: 你的腾讯语音识别服务secret_key
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud Intelligent Speech Interaction service; activate the service on the Alibaba Cloud platform first, then obtain the credentials
    # HTTP POST request, processes the complete audio in one go
    # Platform: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (0.004 CNY/second, 0.24 CNY/minute)
    # But AliyunStreamASR is more real-time (0.005 CNY/second, 0.3 CNY/minute)
    # Define the ASR API type
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud Intelligent Speech Interaction service - real-time streaming speech recognition
    # WebSocket connection, processes the audio stream in real time
    # Platform: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (0.004 CNY/second, 0.24 CNY/minute)
    # But AliyunStreamASR is more real-time (0.005 CNY/second, 0.3 CNY/minute)
    # Define the ASR API type
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # Server region; choose a closer server to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence-break detection time (ms): how long a silence lasts before the sentence is cut; default 800 ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get the AppID, API Key and Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Check the resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: 你的百度语音技术APIKey
    secret_key: 你的百度语音技术SecretKey
    # Language parameter, 1537 is Mandarin; for details see: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service; create an organization on the OpenAI platform and obtain an api_key first
    # Supports speech recognition in Chinese, English, Japanese, Korean and more; see the docs: https://platform.openai.com/docs/guides/speech-to-text
    # Requires a network connection
    # How to apply:
    # 1. Log in to OpenAI Platform. https://auth.openai.com/log-in
    # 2. Create an api-key  https://platform.openai.com/settings/organization/api-keys
    # 3. The model can be gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service; create an API key in the Groq Console first
    # How to apply:
    # 1. Log in to the groq Console. https://console.groq.com/home
    # 2. Create an api-key  https://console.groq.com/keys
    # 3. The model can be whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en only supports English transcription)
    type: openai
    api_key: 你的Groq API密钥
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official site: https://alphacephei.com/vosk/
    # Configuration notes:
    # 1. VOSK is an offline speech recognition library that supports many languages
    # 2. Download the model files first: https://alphacephei.com/vosk/models
    # 3. Recommended Chinese models: vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Runs fully offline, no network connection needed
    # 5. Output files are saved in the tmp/ directory
    # Steps:
    # 1. Visit https://alphacephei.com/vosk/models and download the model you need
    # 2. Extract the model files into the models/vosk/ folder under the project directory
    # 3. Specify the correct model path in the configuration
    # 4. Note: the VOSK Chinese model outputs no punctuation, and words are separated by spaces
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Tongyi Qianwen Qwen3-ASR-Flash speech recognition service; create an API key on the Alibaba Cloud Bailian platform first
    # How to apply:
    # 1. Log in to the Alibaba Cloud Bailian platform. https://bailian.console.aliyun.com/
    # 2. Create an API-KEY  https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is built on the Tongyi Qianwen multimodal base and supports multilingual recognition, singing recognition, noise rejection and more
    type: qwen3_asr_flash
    api_key: 你的阿里云百炼API密钥
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language; supports zh, en, ja, ko, etc.
    context: ""  # Context information to improve recognition accuracy, at most 10000 tokens
  XunfeiStreamASR:
    # iFlytek streaming speech recognition service
    # Create an application on the iFlytek Open Platform first to obtain the credentials below
    # iFlytek Open Platform: https://www.xfyun.cn/
    # After creating the application, get the following under "My Applications":
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Required parameters - iFlytek Open Platform application information
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # Recognition parameters
    domain: slm # Recognition domain; iat: everyday speech, medical: medical, finance: finance, etc.
    language: zh_cn # Language; zh_cn: Chinese, en_us: English
    accent: mandarin # Dialect; mandarin: Mandarin
    # Tune the audio processing parameters to improve recognition quality for long speech
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time speech recognition service
    # WebSocket real-time streaming speech recognition; supports advanced features such as multiple languages, custom hot words and semantic sentence breaking
    # Platform: https://bailian.console.aliyun.com/
    # API Key: https://bailian.console.aliyun.com/#/api-key
    # Documentation: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: 你的阿里云百炼API密钥
    # Model selection; the v2 version is recommended
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate, v1 only supports 16000, the 8k versions only support 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Whether to filter filler words (such as "um", "ah")
    semantic_punctuation_enabled: false  # Semantic sentence breaking (true: meeting scenario, accurate; false: VAD sentence breaking, interactive scenario, low latency)
    max_sentence_silence: 200  # VAD sentence-break silence threshold (ms), range 200-6000; only effective with VAD sentence breaking
    multi_threshold_mode_enabled: false  # Prevents VAD from producing overly long segments; only effective with VAD sentence breaking
    punctuation_prediction_enabled: true  # Whether to add punctuation automatically
    inverse_text_normalization_enabled: true  # Whether to enable ITN (Chinese numerals to Arabic numerals)
    # Custom hot words documentation: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hot word ID (optional)
    # language_hints: ["zh", "en"]  # Specify languages (optional); supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # If pauses in speech are fairly long, set this value higher

LLM:
  # Hyperparameters can be changed for all openai types; AliLLM is used as the example
