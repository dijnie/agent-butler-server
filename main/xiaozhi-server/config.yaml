  HomeAssistant:
    # Define the LLM API type
    type: homeassistant
    base_url: http://homeassistant.local:8123
    agent_id: conversation.chatgpt
    api_key: 你的home assistant api访问令牌
  FastgptLLM:
    # Define the LLM API type
    type: fastgpt
    # If you use fastgpt, the prompt in the configuration file has no effect; set the prompt in the fastgpt console
