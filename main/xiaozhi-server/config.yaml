  LMStudioLLM:
    # Define the LLM API type
    type: openai
    model_name: deepseek-r1-distill-llama-8b@q4_k_m # Model name; it must be downloaded from the community beforehand
    url: http://localhost:1234/v1 # LM Studio service address
