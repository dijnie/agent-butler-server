    response_format: wav
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  CozeCnTTS:
    type: cozecn
    # COZECN TTS
    # Apply for a token: https://www.coze.cn/open/oauth/pats
    voice: 7426720361733046281
    output_dir: tmp/
    access_token: 你的coze web key
    response_format: wav
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
    # The following can be left unset to use the defaults
    # speed: 1  # Speech rate: -0.5 to 2
    # loudness_rate: 0  # Volume: -50 to 100
  VolcesAiGatewayTTS:
    type: openai
    # Volcano Engine - Edge Large Model Gateway
    # Activate the service first: open the URL below, create a gateway access key, then search for and tick Doubao-语音合成 (Doubao speech synthesis) to activate it
    # If you need the LLM provided by the Edge Large Model Gateway, also tick Doubao-pro-32k-functioncall; see also the LLM.VolcesAiGatewayLLM configuration
