  AliLLM:
    # Define the LLM API type
    type: openai
    # Find your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: 你的阿里云百炼API密钥
    temperature: 0.7  # Temperature
    max_tokens: 500   # Maximum number of generated tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  AliAppLLM:
    # Define the LLM API type
    type: AliBL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    app_id: 你的app_id
    # Find your api_key here: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: 你的api_key
    # Whether to skip the local prompt: true|false (not used by default; set the prompt in the Bailian application)
    is_no_prompt: true
    # Ali_memory_id: false (not used) | your memory_id (get it in the Bailian application settings)
    # Tips!: Ali_memory does not implement multi-user memory storage (memory is called by id)
    ali_memory_id: false
  DoubaoLLM:
    # Define the LLM API type
    type: openai
    # Activate the service first: open the URL below, search for Doubao-Seed-2.0-Lite among the services and activate it
