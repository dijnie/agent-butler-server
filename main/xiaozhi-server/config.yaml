    base_url: http://localhost:11434  # Ollama service address
  DifyLLM:
    # Define the LLM API type
    type: dify
    # A locally deployed dify interface is recommended; access to the dify public cloud interface may be restricted in some regions of mainland China
    # If you use DifyLLM, the prompt in the configuration file has no effect; set the prompt in the dify console
    base_url: https://api.dify.ai/v1
    api_key: 你的DifyLLM web key
    # Conversation mode: workflow workflows/run, chat chat-messages, text generation completion-messages
    # When using workflows, the input parameter is query and the output parameter must be named answer
    # The default input parameter for text generation is also query
    mode: chat-messages
  GeminiLLM:
    type: gemini
    # Google Gemini API; create an API key in the Google Cloud console and obtain an api_key first
    # If used within mainland China, comply with the "Interim Measures for the Management of Generative Artificial Intelligence Services"
    # Apply for a token: https://aistudio.google.com/apikey
    # If the interface is unreachable from where you deploy, a proxy is required
    api_key: 你的gemini web key
    model_name: "gemini-2.0-flash"
    http_proxy: ""  #"http://127.0.0.1:10808"
    https_proxy: "" #http://127.0.0.1:10808"
  CozeLLM:
    # Define the LLM API type
    type: coze
    # You can find your personal access token here
