TTS:
  # Currently supported types are edge and doubao; you can adapt others yourself
  EdgeTTS:
    # Define the TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  DoubaoTTS:
    # Define the TTS API type
    type: doubao
    # Volcano Engine speech synthesis service; create an application in the Volcano Engine console and obtain the appid and access_token first
    # Volcano Engine speech must be paid for; the entry price is 30 CNY, which gives 100 concurrent connections. The free tier only has 2 concurrent connections and often reports tts errors
    # After purchasing the service and a free voice, you may have to wait about half an hour before it can be used.
    # Activate ordinary voices here: https://console.volcengine.com/speech/service/8
    # Activate the Wanwan Xiaohe voice here: https://console.volcengine.com/speech/service/10007 , then set voice below to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  # Volcano Engine tts, supports bidirectional streaming tts
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to activate the large-model speech synthesis and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed: volc.service_type.10029 (large-model speech synthesis and mixing)
    # For Gizwits, change the interface address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not need appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Enable WebSocket connection reuse; reused by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameter supported by Volcano Engine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
      # Multi-emotion voice parameters; note: only some voices currently support setting emotion.
      # List of such voices: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (only supported by some voices): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Emotion intensity (1~5)
    # Advanced text processing configuration (additions) - you can add any advanced parameter supported by Volcano Engine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata configuration
      # cache_config: {}  # Cache configuration
    # Mix control configuration (mix_speaker) - mixing multiple voices (TTS 1.0 only)
    # Mixing mainly applies to voices of the Doubao speech synthesis model 1.0; to use it, set req_params.speaker to custom_mix_bigtts
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  # Doubao speech synthesis model 2.0, supports bidirectional streaming tts (based on the seed-tts-2.0 resource)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10035 to activate the large-model speech synthesis and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed: seed-tts-2.0 (Doubao speech synthesis model 2.0)
    # For Gizwits, change the interface address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not need appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: seed-tts-2.0
    speaker: zh_female_xiaohe_uranus_bigtts
    # Enable WebSocket connection reuse; reused by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameter supported by Volcano Engine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
    # Advanced text processing configuration (additions) - you can add any advanced parameter supported by Volcano Engine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  CosyVoiceSiliconflow:
    type: siliconflow
    # SiliconFlow TTS
