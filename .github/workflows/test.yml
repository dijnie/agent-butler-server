name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (xiaozhi-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'main/xiaozhi-server/requirements.txt'
      - name: Install system dependencies
        run: |
          # opuslib_next is a ctypes binding; what pip installs is a pure Python package, and the real encoding/decoding
          # relies on the system libopus.so. The runner does not have it by default, so import fails and audio-related
          # test cases error out directly. The production image Dockerfile-server-base also installs libopus0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
      - name: Install dependencies
        working-directory: main/xiaozhi-server
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio freezegun
      - name: Prepare test config
        working-directory: main/xiaozhi-server
        run: |
          # config/settings.py needs this file at import time; without it the whole test suite cannot even be collected.
          # data/ is in .gitignore, so this step has to create it on the fly
          mkdir -p data
          printf '{}\n' > data/.config.yaml
      - name: Run tests
        working-directory: main/xiaozhi-server
        run: |
          # The Edge TTS case needs to reach Microsoft's public network, and the runner's egress IP gets blocked by risk control, so exclude it for now.
          # The permanent fix is to mark it as live so it is automatically not collected in mock mode (to be changed separately)
          pytest tests/ -v -k "not test_tts_text_to_speak_writes_file"

  java:
    name: Java (manager-api)
    runs-on: ubuntu-latest
    # The three @SpringBootTest classes connect to real MySQL and Redis; an empty database is enough, and Liquibase creates the tables itself
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: xiaozhi_esp32_server
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run tests
        working-directory: main/manager-api
        run: mvn -B test -DskipTests=false -DfailIfNoTests=false
      - name: Check the integration tests really ran
        working-directory: main/manager-api
        # The guard skips whole classes of integration tests when dependencies are incomplete; check here that they actually ran,
        # so the gate is not silently hollowed out
        run: bash scripts/check-integration-tests.sh

  web:
    name: Vue (manager-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main/manager-web/package-lock.json
      - name: Run tests
        working-directory: main/manager-web
        run: |
          npm ci --no-audit --no-fund
          npm run test:contract
          npm run test:unit
          npm run build
